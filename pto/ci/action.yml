name: Prepare upstream Hysteria test suite
description: Install the upstream Python helpers and check upstream Go formatting
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
    - shell: bash
      run: |
        export UV_COMPILE_BYTECODE=1
        uv sync --locked
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        go install mvdan.cc/gofumpt@v0.12.0
        .venv/bin/python hyperbole.py format-check
