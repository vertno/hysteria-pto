name: Publish official stable updates

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: publish-official-stable
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'vertno/hysteria-pto' && github.ref == 'refs/heads/pto'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      heartbeat: ${{ steps.plan.outputs.heartbeat }}
      stable: ${{ steps.plan.outputs.stable }}
      tag: ${{ steps.plan.outputs.tag }}
      base: ${{ steps.plan.outputs.base }}
      latest: ${{ steps.plan.outputs.latest }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select official release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash pto/stable-candidate.sh
      - name: Load build and test steps from the official commit
        if: steps.plan.outputs.build == 'true'
        env:
          OFFICIAL: ${{ steps.plan.outputs.official }}
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m pip install --target "$RUNNER_TEMP/yaml" PyYAML
            export PYTHONPATH="$RUNNER_TEMP/yaml"
          fi
          python3 pto/recipes.py "$OFFICIAL"
      - name: Run official tests
        if: steps.plan.outputs.build == 'true'
        uses: ./.pto-actions/test
      - name: Run official release build
        if: steps.plan.outputs.build == 'true'
        uses: ./.pto-actions/build
      - name: Include update metadata and Linux maintenance files
        if: steps.plan.outputs.build == 'true'
        env:
          STABLE: ${{ steps.plan.outputs.stable }}
          OFFICIAL: ${{ steps.plan.outputs.official }}
        run: |
          bash pto/package.sh
          if [[ -f "$RUNNER_TEMP/candidate.bundle" ]]; then mv "$RUNNER_TEMP/candidate.bundle" build/; fi
      - if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tested-release
          path: build/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs: candidate
    if: needs.candidate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: tested-release
          path: ${{ runner.temp }}/release-files
      - name: Publish the tested source and files
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.candidate.outputs.base }}
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          STABLE: ${{ needs.candidate.outputs.stable }}
          TAG: ${{ needs.candidate.outputs.tag }}
          LATEST: ${{ needs.candidate.outputs.latest }}
        run: bash pto/publish-stable.sh

  keep-schedule-active:
    needs: candidate
    if: needs.candidate.outputs.heartbeat == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Keep scheduled checks active during quiet release cycles
        run: |
          parent=$(git rev-parse --verify refs/remotes/origin/automation/stable-check 2>/dev/null || git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          stamp=$(git commit-tree "$parent^{tree}" -p "$parent" -m 'Stable release polling active')
          git push origin "$stamp:refs/heads/automation/stable-check"
