name: Publish official stable updates
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: publish-official-stable
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'vertno/hysteria-pto' && github.ref == 'refs/heads/pto'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build: ${{ steps.plan.outputs.build }}
      heartbeat: ${{ steps.plan.outputs.heartbeat }}
      stable: ${{ steps.plan.outputs.stable }}
      tag: ${{ steps.plan.outputs.tag }}
      base: ${{ steps.plan.outputs.base }}
      official: ${{ steps.plan.outputs.official }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release and prepare its source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pto/smoke.sh "$RUNNER_TEMP/smoke.sh"
          bash pto/stable-candidate.sh
      - if: steps.plan.outputs.build == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: pto/go-version
          cache-dependency-path: |
            app/go.sum
            core/go.sum
            extras/go.sum
      - if: steps.plan.outputs.build == 'true'
        uses: ./pto/ci
      - name: Build, test and exercise the built binary over loopback
        if: steps.plan.outputs.build == 'true'
        env:
          PTO_UPSTREAM_TAG: ${{ steps.plan.outputs.stable }}
          PTO_FULL_TESTS: '1'
        run: |
          out="$RUNNER_TEMP/release-files"
          bash pto/build.sh "$out"
          bash "$RUNNER_TEMP/smoke.sh" "$out/hysteria-pto-linux-amd64"
          if test -f "$RUNNER_TEMP/candidate.bundle"; then mv "$RUNNER_TEMP/candidate.bundle" "$out/"; fi
      - if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tested-release
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: candidate
    if: needs.candidate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tested-release
          path: ${{ runner.temp }}/release-files
      - name: Advance the fork and publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.candidate.outputs.base }}
          CANDIDATE: ${{ needs.candidate.outputs.commit }}
          TAG: ${{ needs.candidate.outputs.tag }}
          OFFICIAL: ${{ needs.candidate.outputs.official }}
          STABLE: ${{ needs.candidate.outputs.stable }}
        run: bash pto/publish-stable.sh

  keep-schedule-active:
    needs: candidate
    if: needs.candidate.outputs.heartbeat == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Record periodic activity on the scheduling branch
        run: |
          parent=$(git rev-parse --verify refs/remotes/origin/automation/stable-check 2>/dev/null || git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          stamp=$(git commit-tree "$parent^{tree}" -p "$parent" -m 'Stable release polling active')
          git push origin "$stamp:refs/heads/automation/stable-check"
